[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; Без OTA: один большой app-раздел 2.5 МБ (см. partitions.csv)
; No OTA: a single 2.5 MB app partition (see partitions.csv)
board_build.partitions = partitions.csv
; ВАЖНО: flash только 40 МГц + DIO. На 80 МГц модули с неизвестным JEDEC-ID
; (попадались 0x464016, 4 МБ) не стираются и не пишутся из приложения: девайс
; работает, но НИЧЕГО не сохраняет (NVS), а ROM-чтение подвешивает чип.
; IMPORTANT: 40 MHz + DIO only. At 80 MHz flash chips with an unknown JEDEC-ID
; (0x464016, 4 MB units were seen) cannot be erased or written from the app:
; the device runs but saves NOTHING (NVS), and ROM reads hang the chip.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
; Метка версии (FW_BIN_MARKER) видна в .bin строкой CLICKERFW:; без этого флага
; линковщик выбрасывает её как неиспользуемую (--gc-sections).
; The version marker (FW_BIN_MARKER) shows up in the .bin as CLICKERFW:; without
; this flag the linker drops it as unused (--gc-sections).
build_flags = -Wl,--undefined=FW_BIN_MARKER
lib_deps =
	olikraus/U8g2@^2.34.14
